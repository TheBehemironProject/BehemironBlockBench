# BehemironBlockBench fork 本地化配置 —— 不修改上游 package.json,
# rebase upstream/master 时永远不会冲突。
#
# pnpm v10+ 默认拒绝任意包运行 postinstall / install / preinstall 脚本
# (防供应链攻击)。下列包都是 Blockbench 原生构建链的组成部分,上游已审核。
# 全部放行以保证 dev / build-web / build-electron / package 任一姿势都可用。

allowBuilds:
  '@parcel/watcher': true   # Electron dev 模式文件监听
  electron: true            # Electron 桌面运行时(用于对照原版 Blockbench)
  electron-winstaller: true # Windows 安装包构造
  esbuild: true             # 构建必需(web 构建也走 esbuild)
